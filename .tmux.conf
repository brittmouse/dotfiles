set -g default-terminal "tmux-256color"
set-option -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# TPM plugin
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'alexforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'idevtier/tmux-cargo'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @session-wizard 'T u'

# Catppuccin config edit
set -g status-position top
set -g @catppuccin_flavor 'macchiato'
run $HOME/.tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g @catppuccin_window_status_style "slanted"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TPM (keep at the bottom of the file!)
run '~/.tmux/plugins/tpm/tpm'
